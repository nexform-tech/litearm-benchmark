[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litearm-benchmark"
version = "0.1.0"
description = "Benchmark and torque-estimation accuracy evaluation tools for the LiteArm robotic manipulator series."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
sdk = ["litearm-python @ git+https://github.com/nexform-tech/litearm-python.git@5f757686a11aebbbca808bfddf53aaff29a7976b"]

[project.scripts]
litearm-tau = "litearm_benchmark.torque_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
